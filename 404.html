<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Yacht Boss Miami</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
  <style>
    :root {
      --gold: #B8975A;
      --black: #08090C;
      --border: rgba(184,151,90,0.2);
      --text: #E8E0D0;
      --muted: #8A8070;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--black); color: var(--text); font-family: 'Montserrat', sans-serif; font-weight: 400; min-height: 100vh; display: flex; flex-direction: column; }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 48px;
      background: rgba(8,9,12,0.97);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem; font-weight: 600; color: #fff;
      letter-spacing: 0.12em; text-transform: uppercase;
      text-decoration: none;
    }
    main {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 80px 24px 60px;
    }
    .error-code {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(5rem, 20vw, 12rem); font-weight: 300;
      color: var(--gold); line-height: 1; margin-bottom: 24px; opacity: 0.6;
    }
    .error-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 4vw, 2.5rem); font-weight: 400;
      color: #fff; margin-bottom: 16px;
    }
    .error-sub {
      font-size: 0.8rem; color: var(--muted); letter-spacing: 0.06em;
      margin-bottom: 48px; line-height: 1.7;
    }
    .btn-fleet {
      display: inline-block;
      background: var(--gold); color: var(--black);
      font-family: 'Montserrat', sans-serif; font-size: 0.72rem;
      font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
      text-decoration: none; padding: 16px 40px;
      transition: background 0.2s;
    }
    .btn-fleet:hover { background: #D4B078; }
    footer {
      padding: 32px 48px; border-top: 1px solid var(--border);
      text-align: center;
    }
    .footer-copy { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.08em; }
    @media (max-width: 768px) {
      nav { padding: 16px 20px; }
      footer { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/yachtbossmiami/" class="nav-logo">Yacht Boss Miami</a>
  </nav>

  <main>
    <div class="error-code">404</div>
    <h1 class="error-heading">This page doesn't exist</h1>
    <p class="error-sub">The vessel you're looking for may have set sail.<br>Head back to the fleet to find your charter.</p>
    <a href="/yachtbossmiami/#fleet" class="btn-fleet">Back to the Fleet</a>
  </main>

  <footer>
    <div class="footer-copy">© 2025 Yacht Boss Miami. All rights reserved.</div>
  </footer>
</body>
</html>
