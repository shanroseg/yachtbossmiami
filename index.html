<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Yacht Boss Miami — Charter Fleet</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --black:#08090C;--deep:#0C0E14;--surface:#111318;--surface2:#181B23;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --white:#F8F5F0;--muted:#7A7670;--muted2:#9E9890;--gold:#B8975A;--gold2:#D4AF72;
}
html{scroll-behavior:smooth;}
body{background:var(--black);color:var(--white);font-family:'Montserrat',sans-serif;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.022;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:200px 200px;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;justify-content:space-between;align-items:center;padding:1.6rem 3.5rem;border-bottom:1px solid transparent;transition:background .4s,border-color .4s,padding .3s;}
nav.scrolled{background:rgba(8,9,12,0.96);border-color:var(--border);padding:1.1rem 3.5rem;backdrop-filter:blur(12px);}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.55rem;font-weight:300;letter-spacing:8px;text-transform:uppercase;color:var(--white);text-decoration:none;}
.logo strong{font-weight:600;color:var(--gold);}
.nav-links{display:flex;gap:2.5rem;align-items:center;}
.nav-links a{font-size:.6rem;letter-spacing:3px;text-transform:uppercase;font-weight:500;color:var(--muted2);text-decoration:none;transition:color .2s;}
.nav-links a:hover{color:var(--white);}
.nav-cta{border:1px solid var(--gold)!important;color:var(--gold)!important;padding:.5rem 1.4rem;transition:background .2s,color .2s!important;}
.nav-cta:hover{background:var(--gold)!important;color:var(--black)!important;}

/* HERO */
.hero{min-height:100vh;display:flex;align-items:flex-end;position:relative;overflow:hidden;padding:0 3.5rem 5.5rem;}
.hero-grid-h{position:absolute;top:50%;left:0;right:0;height:1px;background:var(--border);pointer-events:none;}
.hero-grid-v{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border);pointer-events:none;}
.hero-content{position:relative;z-index:2;max-width:1300px;width:100%;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:end;}
.hero-eyebrow{font-size:.58rem;letter-spacing:4px;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:2rem;display:flex;align-items:center;gap:1rem;}
.hero-eyebrow::before{content:'';display:block;width:28px;height:1px;background:var(--gold);}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(4rem,8vw,7rem);font-weight:300;line-height:.92;letter-spacing:-1px;color:var(--white);margin-bottom:2.5rem;}
h1 em{font-style:italic;color:var(--gold);display:block;}
.hero-btns{display:flex;gap:1rem;flex-wrap:wrap;}
.btn-gold{background:var(--gold);color:var(--black);padding:.85rem 2.2rem;font-size:.6rem;letter-spacing:3px;text-transform:uppercase;font-weight:600;text-decoration:none;display:inline-block;transition:background .2s,transform .15s;}
.btn-gold:hover{background:var(--gold2);transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--muted2);border:1px solid var(--border2);padding:.85rem 2.2rem;font-size:.6rem;letter-spacing:3px;text-transform:uppercase;font-weight:500;text-decoration:none;display:inline-block;transition:all .2s;}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
.hero-right{display:flex;flex-direction:column;gap:2.5rem;padding-bottom:.25rem;}
.hero-desc{font-size:.85rem;line-height:2;color:var(--muted2);font-weight:300;border-left:1px solid var(--gold);padding-left:1.5rem;}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;}
.stat{border-top:1px solid var(--border);padding-top:1.25rem;}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;color:var(--white);letter-spacing:-1px;line-height:1;}
.stat-lbl{font-size:.55rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-top:.4rem;font-weight:500;}

/* MARQUEE */
.marquee-strip{border-top:1px solid var(--border);border-bottom:1px solid var(--border);overflow:hidden;padding:.75rem 0;background:var(--deep);}
.marquee-inner{display:flex;gap:0;white-space:nowrap;animation:marquee 55s linear infinite;width:max-content;}
.marquee-item{font-size:.55rem;letter-spacing:4px;text-transform:uppercase;color:var(--muted);font-weight:500;padding:0 2.5rem;border-right:1px solid var(--border);}
.marquee-item:last-child{border-right:none;}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* FLEET */
.fleet-section{padding:7rem 3.5rem;background:var(--black);}
.fleet-inner{max-width:1300px;margin:0 auto;}
.section-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:3.5rem;padding-bottom:2rem;border-bottom:1px solid var(--border);gap:2rem;flex-wrap:wrap;}
.kicker{font-size:.56rem;letter-spacing:4px;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:.75rem;display:flex;align-items:center;gap:.75rem;}
.kicker::before{content:'';display:block;width:20px;height:1px;background:var(--gold);}
.section-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,4vw,3rem);font-weight:300;letter-spacing:-.5px;color:var(--white);line-height:1;}
.section-title em{font-style:italic;color:var(--gold);}
.section-note{font-size:.7rem;line-height:1.9;color:var(--muted);font-weight:300;max-width:240px;text-align:right;}
.filter-bar{display:flex;gap:0;margin-bottom:3rem;border:1px solid var(--border);width:100%;flex-wrap:wrap;}
.filter-btn{background:transparent;color:var(--muted);border:none;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:.65rem 1.5rem;font-family:'Montserrat',sans-serif;font-size:.56rem;letter-spacing:3px;text-transform:uppercase;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap;flex:1;min-width:120px;}
.filter-btn:last-child{border-right:none;}
.filter-btn:hover{color:var(--white);background:var(--surface);}
.filter-btn.active{background:var(--gold);color:var(--black);}
.fleet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);}

/* CARD */
.yacht-card{background:var(--deep);display:flex;flex-direction:column;transition:background .3s;position:relative;}
.yacht-card:hover{background:var(--surface);}
.yacht-card.hidden{display:none;}
.card-img{height:210px;overflow:hidden;position:relative;background:var(--surface2);}
.card-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease;}
.yacht-card:hover .card-img img{transform:scale(1.04);}
.card-img-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.65rem;background:linear-gradient(155deg,var(--surface2) 0%,#080B13 100%);}
.ph-rule{width:22px;height:1px;background:var(--border2);}
.ph-text{font-size:.5rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:500;}
.card-tier{position:absolute;top:.85rem;left:.85rem;font-size:.5rem;letter-spacing:3px;text-transform:uppercase;font-weight:600;padding:.28rem .65rem;border:1px solid;}
.tier-day{border-color:rgba(255,255,255,0.2);color:rgba(248,245,240,0.7);background:rgba(8,9,12,0.72);}
.tier-luxury{border-color:rgba(184,151,90,0.45);color:var(--gold);background:rgba(8,9,12,0.78);}
.tier-ultra{border-color:var(--gold);color:var(--gold);background:rgba(8,9,12,0.82);}
.tier-request{border-color:rgba(255,255,255,0.12);color:var(--muted2);background:rgba(8,9,12,0.78);}
.card-body{padding:1.25rem 1.5rem 1.5rem;flex:1;display:flex;flex-direction:column;gap:.75rem;}
.card-name{font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:400;color:var(--white);line-height:1.15;}
.card-type{font-size:.54rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-top:.35rem;}
.card-specs{display:flex;gap:.4rem;flex-wrap:wrap;padding-top:.75rem;border-top:1px solid var(--border);}
.spec-tag{font-size:.5rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:500;border:1px solid var(--border);padding:.2rem .55rem;}
.card-footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:1rem;gap:.75rem;}
.price-label{font-size:.5rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:.2rem;}
.price-val{font-family:'Cormorant Garamond',serif;font-size:1.55rem;font-weight:300;color:var(--white);letter-spacing:-.5px;line-height:1;}
.price-request{font-size:.75rem;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:300;font-family:'Montserrat',sans-serif;}
.price-note{font-size:.5rem;color:var(--muted);margin-top:.22rem;letter-spacing:.5px;}
.card-link{flex-shrink:0;font-size:.52rem;letter-spacing:3px;text-transform:uppercase;font-weight:600;color:var(--gold);text-decoration:none;border:1px solid rgba(184,151,90,.3);padding:.48rem 1rem;transition:all .2s;white-space:nowrap;cursor:pointer;background:none;font-family:'Montserrat',sans-serif;}
.card-link:hover{background:var(--gold);color:var(--black);border-color:var(--gold);}

/* ── MODAL ── */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:2000;
  background:rgba(4,5,8,0.97);
  overflow-y:auto;
}
.modal-overlay.open{display:block;}
.modal{
  max-width:1100px;margin:0 auto;
  padding:5rem 3rem 4rem;
  position:relative;
}
.modal-close{
  position:fixed;top:1.75rem;right:2rem;
  background:none;border:1px solid var(--border2);
  color:var(--muted2);font-size:.55rem;letter-spacing:3px;
  text-transform:uppercase;font-weight:600;font-family:'Montserrat',sans-serif;
  padding:.55rem 1.1rem;cursor:pointer;z-index:10;
  transition:all .2s;
}
.modal-close:hover{border-color:var(--gold);color:var(--gold);}
.modal-header{margin-bottom:2.5rem;padding-bottom:2rem;border-bottom:1px solid var(--border);}
.modal-kicker{font-size:.55rem;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:.75rem;display:flex;align-items:center;gap:.75rem;}
.modal-kicker::before{content:'';display:block;width:20px;height:1px;background:var(--gold);}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2.5rem,5vw,4rem);font-weight:300;letter-spacing:-1px;color:var(--white);line-height:.95;}
.modal-title em{font-style:italic;color:var(--gold);}
.modal-meta{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem;}
.modal-tag{font-size:.5rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);padding:.25rem .65rem;}

/* MODAL LAYOUT: desc left, price right */
.modal-info{
  display:grid;grid-template-columns:1fr auto;gap:3rem;
  margin-bottom:3rem;padding-bottom:3rem;border-bottom:1px solid var(--border);
  align-items:start;
}
.modal-desc{font-size:.85rem;line-height:2;color:var(--muted2);font-weight:300;}
.modal-desc p{margin-bottom:1rem;}
.modal-desc p:last-child{margin-bottom:0;}
.modal-pricing{min-width:220px;}
.modal-price-row{padding:1rem 0;border-bottom:1px solid var(--border);}
.modal-price-row:first-child{padding-top:0;}
.modal-price-label{font-size:.5rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem;}
.modal-price-val{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;color:var(--white);letter-spacing:-.5px;line-height:1;}
.modal-price-note{font-size:.5rem;color:var(--muted);margin-top:.2rem;}
.modal-inquire{
  display:block;margin-top:1.5rem;
  background:var(--gold);color:var(--black);
  padding:.85rem 1.5rem;text-align:center;
  font-size:.6rem;letter-spacing:3px;text-transform:uppercase;font-weight:600;
  text-decoration:none;transition:background .2s;
}
.modal-inquire:hover{background:var(--gold2);}

/* GALLERY */
.modal-gallery-label{font-size:.55rem;letter-spacing:4px;text-transform:uppercase;color:var(--muted);margin-bottom:1.5rem;display:flex;align-items:center;gap:.75rem;}
.modal-gallery-label::before{content:'';display:block;width:20px;height:1px;background:var(--border2);}
.gallery-hero{width:100%;height:500px;object-fit:cover;display:block;margin-bottom:1px;}
.gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;}
.gallery-grid img{width:100%;height:180px;object-fit:cover;display:block;cursor:pointer;transition:opacity .2s;}
.gallery-grid img:hover{opacity:.8;}


/* ── LIGHTBOX ── */
let lbBoat = null, lbIdx = 0;
const boatImgMap = {
  matrix: matrixImgs,
  catalaya: catalayaImgs,
  summergirl: summergirlImgs,
  remedy: remedyImgs,
  vention: ventionImgs,
  swwc: swwcImgs,
  leopard: leopardImgs,
  squadron: squadronImgs,
};

function openLightbox(boat, idx) {
  lbBoat = boat; lbIdx = idx;
  document.getElementById('lb-img').src = boatImgMap[boat][idx];
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
function lbNav(dir) {
  const imgs = boatImgMap[lbBoat];
  lbIdx = (lbIdx + dir + imgs.length) % imgs.length;
  document.getElementById('lb-img').src = imgs[lbIdx];
}

</script>
</body>
</html>
