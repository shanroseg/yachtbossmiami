<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --black:#08090C;--deep:#0C0E14;--surface:#111318;--surface2:#181B23;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --white:#F8F5F0;--muted:#7A7670;--muted2:#9E9890;--gold:#B8975A;--gold2:#D4AF72;
}
html{scroll-behavior:smooth;}
body{background:var(--black);color:var(--white);font-family:'Montserrat',sans-serif;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.022;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:200px 200px;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;justify-content:space-between;align-items:center;padding:1.6rem 3.5rem;border-bottom:1px solid transparent;transition:background .4s,border-color .4s,padding .3s;}
nav.scrolled{background:rgba(8,9,12,0.96);border-color:var(--border);padding:1.1rem 3.5rem;backdrop-filter:blur(12px);}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.55rem;font-weight:300;letter-spacing:8px;text-transform:uppercase;color:var(--white);text-decoration:none;}
.logo strong{font-weight:600;color:var(--gold);}
.nav-links{display:flex;gap:2.5rem;align-items:center;}
.nav-links a{font-size:.6rem;letter-spacing:3px;text-transform:uppercase;font-weight:500;color:var(--muted2);text-decoration:none;transition:color .2s;}
.nav-links a:hover{color:var(--white);}
.nav-cta{border:1px solid var(--gold)!important;color:var(--gold)!important;padding:.5rem 1.4rem;transition:background .2s,color .2s!important;}
.nav-cta:hover{background:var(--gold)!important;color:var(--black)!important;}


/* HERO SLIDESHOW */
let slideIdx = 0;
const slides = document.querySelectorAll('.hero-slide');
const dots = document.querySelectorAll('.hero-dot');
const labels = document.querySelectorAll('.hero-boat-label');
function goSlide(n) {
  slides[slideIdx].classList.remove('active');
  dots[slideIdx].classList.remove('active');
  labels[slideIdx].classList.remove('active');
  slideIdx = n;
  slides[slideIdx].classList.add('active');
  dots[slideIdx].classList.add('active');
  labels[slideIdx].classList.add('active');
}
setInterval(function(){ goSlide((slideIdx + 1) % slides.length); }, 5000);

/* COMING SOON */
function comingSoon(el) {
  const prev = el.textContent;
  el.textContent = 'Coming Soon';
  el.style.opacity = '0.5';
  setTimeout(function(){ el.textContent = prev; el.style.opacity = ''; }, 2000);
}

/* LIGHTBOX */
let lbBoat = null, lbIdx = 0;
const boatImgMap = {
  matrix: matrixImgs,
  catalaya: catalayaImgs,
  summergirl: summergirlImgs,
  remedy: remedyImgs,
  vention: ventionImgs,
  swwc: swwcImgs,
  leopard: leopardImgs,
  squadron: squadronImgs,
};
function openLightbox(boat, idx) {
  lbBoat = boat; lbIdx = idx;
  document.getElementById('lb-img').src = boatImgMap[boat][idx];
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
function lbNav(dir) {
  const imgs = boatImgMap[lbBoat];
  lbIdx = (lbIdx + dir + imgs.length) % imgs.length;
  document.getElementById('lb-img').src = imgs[lbIdx];
}

/* NAV */
const nav = document.getElementById('nav');
window.addEventListener('scroll',()=>nav.classList.toggle('scrolled',window.scrollY>60));

/* FILTER */
function filterFleet(cat,btn){
  if(btn){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
  document.querySelectorAll('.yacht-card').forEach(card=>card.classList.toggle('hidden',cat!=='all'&&card.dataset.cat!==cat));
}

/* MODAL */
function openModal(id){
  document.getElementById('modal-'+id).classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.querySelectorAll('.modal-overlay').forEach(m=>m.classList.remove('open'));
  document.body.style.overflow='';
  closeLightbox();
}
document.querySelectorAll('.modal-overlay').forEach(m=>{
  m.addEventListener('click',e=>{if(e.target===m)closeModal();});
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
